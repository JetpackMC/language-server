name: Release VSIX

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v1.0.0
        required: true
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload-vsix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate release version
        shell: bash
        run: |
          tag="${{ inputs.tag || github.event.release.tag_name || github.ref_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match v0.0.0, got: $tag"
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          tag_version="${tag#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "package.json version ($package_version) must match release tag ($tag_version)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx vsce package --out "jetpack-language-support-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}.vsix"

      - name: Upload VSIX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ inputs.tag || github.event.release.tag_name || github.ref_name }}"
          file="jetpack-language-support-${tag}.vsix"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber
          else
            gh release create "$tag" "$file" --title "$tag" --notes "VSIX build for $tag"
          fi
