name: Release VSIX

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload-vsix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate release version
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match v0.0.0, got: $tag"
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          tag_version="${tag#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "package.json version ($package_version) must match release tag ($tag_version)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx vsce package --out "jetpack-language-support-${{ github.event.release.tag_name }}.vsix"

      - name: Upload VSIX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "jetpack-language-support-${{ github.event.release.tag_name }}.vsix" --clobber
